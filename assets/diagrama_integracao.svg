<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-int" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trap-shd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="simp-shd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg-int)"/>

  <!-- Título Superior -->
  <text x="60" y="55" fill="#f8fafc" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Integração Numérica — Quadratura de Newton-Cotes</text>
  <text x="60" y="85" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Comparação geométrica entre a aproximação linear (Trapézio) e parabólica (Simpson 1/3)</text>

  <!-- CARD ESQUERDO: TRAPÉZIO -->
  <g transform="translate(60, 115)">
    <rect width="525" height="460" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="24" y="38" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">APROXIMAÇÃO LINEAR POR FAIXAS</text>
    <text x="24" y="68" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Regra do Trapézio Composta</text>
    
    <!-- Gráfico -->
    <g transform="translate(20, 85)">
      <rect width="485" height="180" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <!-- Eixos -->
      <line x1="25" y1="150" x2="460" y2="150" stroke="#4b5563" stroke-width="1.5"/>
      <line x1="45" y1="20" x2="45" y2="165" stroke="#4b5563" stroke-width="1.5"/>
      
      <!-- Área dos Trapézios -->
      <polygon points="65,150 65,110 160,75 255,55 350,65 440,115 440,150" fill="url(#trap-shd)"/>

      <!-- Linhas verticais dos trapézios -->
      <line x1="65" y1="110" x2="65" y2="150" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="160" y1="75" x2="160" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="255" y1="55" x2="255" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="350" y1="65" x2="350" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="440" y1="115" x2="440" y2="150" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Cordas retas no topo -->
      <polyline points="65,110 160,75 255,55 350,65 440,115" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Curva Real f(x) -->
      <path d="M 50 120 Q 255 30 455 125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>

      <!-- Rótulos dos Nós -->
      <g font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">
        <text x="55" y="168">a=x₀</text>
        <text x="152" y="168">x₁</text>
        <text x="247" y="168">x₂</text>
        <text x="342" y="168">x₃</text>
        <text x="425" y="168">b=x₄</text>
      </g>
    </g>

    <!-- Equação -->
    <rect x="20" y="280" width="485" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="262" y="313" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700" font-family="monospace">I ≈ (h/2) · [ f(a) + 2·Σ f(x_i) + f(b) ]</text>

    <!-- Propriedades -->
    <g transform="translate(24, 360)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="700">Erro de Truncamento Global: O(h²)</text>
      <text x="0" y="26" fill="#94a3b8" font-size="15">Partição: Funciona com QUALQUER número de subintervalos n</text>
      <text x="0" y="50" fill="#94a3b8" font-size="15">Base: Polinômio interpolador de 1º grau por faixa linear</text>
      <text x="0" y="74" fill="#38bdf8" font-size="15" font-weight="600">Arquivo: integracao_numerica/trapezio_composto.m</text>
    </g>
  </g>

  <!-- CARD DIREITO: SIMPSON 1/3 -->
  <g transform="translate(615, 115)">
    <rect width="525" height="460" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="24" y="38" fill="#a78bfa" font-size="14" font-weight="700" font-family="monospace">QUADRATURA PARABÓLICA (ALTA PRECISÃO)</text>
    <text x="24" y="68" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Regra de Simpson 1/3 Composta</text>
    
    <!-- Gráfico -->
    <g transform="translate(20, 85)">
      <rect width="485" height="180" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <!-- Eixos -->
      <line x1="25" y1="150" x2="460" y2="150" stroke="#4b5563" stroke-width="1.5"/>
      <line x1="45" y1="20" x2="45" y2="165" stroke="#4b5563" stroke-width="1.5"/>
      
      <!-- Área Parabólica -->
      <path d="M 65 150 L 65 110 Q 160 50 255 55 Q 350 60 440 115 L 440 150 Z" fill="url(#simp-shd)"/>

      <!-- Linhas verticais -->
      <line x1="65" y1="110" x2="65" y2="150" stroke="#a78bfa" stroke-width="1.5"/>
      <line x1="160" y1="65" x2="160" y2="150" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="255" y1="55" x2="255" y2="150" stroke="#a78bfa" stroke-width="2"/>
      <line x1="350" y1="68" x2="350" y2="150" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3"/>
      <line x1="440" y1="115" x2="440" y2="150" stroke="#a78bfa" stroke-width="1.5"/>

      <!-- Arcos Parabólicos de 3 pontos -->
      <path d="M 65 110 Q 160 50 255 55" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <path d="M 255 55 Q 350 60 440 115" fill="none" stroke="#a78bfa" stroke-width="3"/>

      <!-- Nós com pesos -->
      <circle cx="65" cy="110" r="4" fill="#ffffff"/>
      <circle cx="160" cy="65" r="5" fill="#fbbf24"/>
      <circle cx="255" cy="55" r="5" fill="#38bdf8"/>
      <circle cx="350" cy="68" r="5" fill="#fbbf24"/>
      <circle cx="440" cy="115" r="4" fill="#ffffff"/>

      <!-- Rótulos com pesos da quadratura -->
      <g font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">
        <text x="55" y="168">x₀ <tspan font-size="12" fill="#94a3b8">(×1)</tspan></text>
        <text x="150" y="168">x₁ <tspan font-size="12" fill="#fbbf24">(×4)</tspan></text>
        <text x="245" y="168">x₂ <tspan font-size="12" fill="#38bdf8">(×2)</tspan></text>
        <text x="340" y="168">x₃ <tspan font-size="12" fill="#fbbf24">(×4)</tspan></text>
        <text x="425" y="168">x₄ <tspan font-size="12" fill="#94a3b8">(×1)</tspan></text>
      </g>
    </g>

    <!-- Equação -->
    <rect x="20" y="280" width="485" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="262" y="313" text-anchor="middle" fill="#a78bfa" font-size="17" font-weight="700" font-family="monospace">I ≈ (h/3) · [ f₀ + 4·Σ(ímpares) + 2·Σ(pares) + f_n ]</text>

    <!-- Propriedades -->
    <g transform="translate(24, 360)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="700">Erro de Truncamento Global: O(h⁴)</text>
      <text x="0" y="26" fill="#fbbf24" font-size="15" font-weight="700">Restrição Obrigatória: O número de faixas n DEVE SER PAR</text>
      <text x="0" y="50" fill="#94a3b8" font-size="15">Base: Arcos parabólicos passando por 3 nós consecutivos</text>
      <text x="0" y="74" fill="#a78bfa" font-size="15" font-weight="600">Arquivo: integracao_numerica/simpson_13_composto.m</text>
    </g>
  </g>
</svg>