<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="glow-blue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="420" fill="url(#glow-blue)"/>
  <rect width="1200" height="420" fill="url(#glow-cyan)"/>
  <rect width="1200" height="420" fill="url(#glow-violet)"/>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Header Accent Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3"/>

  <!-- ================= LEFT HERO CONTENT ================= -->
  <g transform="translate(60, 48)">
    <!-- Badges -->
    <g>
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
      <text x="26" y="18" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">GNU OCTAVE • MATLAB</text>

      <rect x="230" y="0" width="168" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="244" cy="14" r="5" fill="#818cf8"/>
      <text x="256" y="18" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">IEEE 754 PRECISION</text>
    </g>

    <!-- Main Title (Solid white for 100% reliable rendering) -->
    <text x="0" y="86" fill="#ffffff" font-size="44" font-weight="800" class="font-sans">
      Métodos Numéricos
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="118" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="0.8" class="font-mono">
      CÁLCULO CIENTÍFICO &amp; ANÁLISE COMPUTACIONAL
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="152" fill="#94a3b8" font-size="14.5" font-weight="400" class="font-sans">
      Implementações de referência vetorizadas para resolução de raízes reais,
    </text>
    <text x="0" y="174" fill="#94a3b8" font-size="14.5" font-weight="400" class="font-sans">
      sistemas lineares de grande porte, quadratura numérica e equações diferenciais.
    </text>
    <text x="0" y="196" fill="#94a3b8" font-size="14.5" font-weight="400" class="font-sans">
      Código limpo, didático e pronto para cálculo de engenharia e ciências exatas.
    </text>

    <!-- Feature Interactive Pills -->
    <g transform="translate(0, 226)">
      <!-- Pill 1: Raízes -->
      <g transform="translate(0, 0)">
        <rect width="138" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="18" fill="#38bdf8" font-size="11" font-weight="700" class="font-mono">f(x) = 0</text>
        <text x="14" y="32" fill="#f1f5f9" font-size="12" font-weight="600" class="font-sans">Raízes Reais</text>
      </g>

      <!-- Pill 2: Sistemas -->
      <g transform="translate(148, 0)">
        <rect width="138" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="18" fill="#818cf8" font-size="11" font-weight="700" class="font-mono">Ax = b</text>
        <text x="14" y="32" fill="#f1f5f9" font-size="12" font-weight="600" class="font-sans">Gauss &amp; Jordan</text>
      </g>

      <!-- Pill 3: Integração -->
      <g transform="translate(296, 0)">
        <rect width="138" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="18" fill="#34d399" font-size="11" font-weight="700" class="font-mono">∫ f(x) dx</text>
        <text x="14" y="32" fill="#f1f5f9" font-size="12" font-weight="600" class="font-sans">Quadratura</text>
      </g>

      <!-- Pill 4: EDOs -->
      <g transform="translate(444, 0)">
        <rect width="138" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="18" fill="#f43f5e" font-size="11" font-weight="700" class="font-mono">dy/dx = f</text>
        <text x="14" y="32" fill="#f1f5f9" font-size="12" font-weight="600" class="font-sans">Euler &amp; RK2</text>
      </g>
    </g>

    <!-- Status Footer Bar -->
    <g transform="translate(0, 302)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="20" y="10" fill="#cbd5e1" font-size="12" font-weight="500" class="font-mono">
        100% Código Aberto • Sem Dependências Externas • Compatibilidade 1:1
      </text>
    </g>
  </g>

  <!-- ================= RIGHT VISUAL HUD CARD ================= -->
  <g transform="translate(680, 42)" filter="url(#soft-shadow)">
    <!-- Container Card -->
    <rect width="460" height="332" rx="16" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="460" height="38" rx="16" fill="#1e293b" fill-opacity="0.6"/>
    <!-- Terminal Dots -->
    <circle cx="24" cy="19" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="40" cy="19" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="56" cy="19" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="80" y="23" fill="#94a3b8" font-size="11.5" font-weight="500" class="font-mono">convergence_monitor.m</text>

    <!-- Mini Status Tag -->
    <rect x="350" y="9" width="94" height="20" rx="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="362" y="23" fill="#38bdf8" font-size="10.5" font-weight="700" class="font-mono">CONVERGED</text>

    <!-- Card Interior Graph Stage -->
    <g transform="translate(24, 52)">
      <!-- Internal Grid -->
      <line x1="0" y1="40" x2="412" y2="40" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>
      <line x1="0" y1="90" x2="412" y2="90" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>
      <line x1="0" y1="140" x2="412" y2="140" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>
      
      <!-- Coordinate Axes -->
      <line x1="30" y1="15" x2="30" y2="165" stroke="#475569" stroke-width="1.5"/>
      <line x1="20" y1="140" x2="395" y2="140" stroke="#475569" stroke-width="1.5"/>
      <text x="390" y="155" fill="#64748b" font-size="11" font-weight="700" class="font-mono">x</text>
      <text x="18" y="20" fill="#64748b" font-size="11" font-weight="700" class="font-mono">y</text>

      <!-- Numerical Integration Strips (Under Curve Fill) -->
      <path d="M 90 140 L 90 115 L 140 88 L 190 62 L 240 46 L 290 42 L 340 68 L 340 140 Z" fill="url(#fill-grad)"/>
      
      <!-- Strip Separation Lines (Trapezoidal Rule visual) -->
      <line x1="90" y1="140" x2="90" y2="115" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="140" y1="140" x2="140" y2="88" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="190" y1="140" x2="190" y2="62" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="240" y1="140" x2="240" y2="46" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="290" y1="140" x2="290" y2="42" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="340" y1="140" x2="340" y2="68" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

      <!-- Smooth Curve f(x) (High contrast cyan) -->
      <path d="M 40 135 C 90 120, 160 55, 240 46 C 290 40, 340 65, 390 125" 
            fill="none" stroke="#38bdf8" stroke-width="2.8"/>

      <!-- Tangent Line (Newton-Raphson Step) -->
      <line x1="130" y1="140" x2="255" y2="45" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4,2"/>
      
      <!-- Current Step Point (xk, f(xk)) -->
      <circle cx="240" cy="56" r="4.5" fill="#f43f5e"/>
      <line x1="240" y1="56" x2="240" y2="140" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="240" cy="140" r="3" fill="#f43f5e"/>
      <text x="235" y="156" fill="#f43f5e" font-size="10" font-weight="700" class="font-mono">x_k</text>

      <!-- Tangent Intercept (xk+1) -->
      <circle cx="130" cy="140" r="4" fill="#38bdf8"/>
      <text x="115" y="156" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">x_k+1</text>

      <!-- Exact Root Marker x* -->
      <circle cx="118" cy="140" r="5" fill="#10b981"/>
      <text x="80" y="130" fill="#10b981" font-size="10" font-weight="700" class="font-mono">x* (raiz)</text>

      <!-- Matrix Escalation HUD Floating Mini-Box -->
      <g transform="translate(12, 178)">
        <rect width="388" height="82" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
        
        <!-- Matrix visual -->
        <text x="16" y="24" fill="#94a3b8" font-size="10" font-weight="600" class="font-mono">GAUSS PIVOTING:</text>
        <text x="16" y="44" fill="#38bdf8" font-size="11.5" font-weight="600" class="font-mono">[ 8.40  -1.20   2.10 |  14.5 ]</text>
        <text x="16" y="60" fill="#64748b" font-size="11.5" font-weight="500" class="font-mono">[ 0.00   5.15  -0.84 |  -3.2 ]</text>
        <text x="16" y="74" fill="#818cf8" font-size="11.5" font-weight="500" class="font-mono">[ 0.00   0.00   3.92 |   7.8 ]</text>

        <!-- Stats breakdown on right side -->
        <line x1="235" y1="10" x2="235" y2="72" stroke="#1e293b" stroke-width="1"/>
        <text x="250" y="25" fill="#64748b" font-size="10" font-weight="600" class="font-mono">ERRO RESIDUAL</text>
        <text x="250" y="44" fill="#10b981" font-size="14" font-weight="700" class="font-mono">ε &lt; 1.42e-14</text>
        <text x="250" y="65" fill="#94a3b8" font-size="10" class="font-mono">Iterações: 5 passos</text>
      </g>
    </g>
  </g>
</svg>
