<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-flx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg-flx)"/>

  <!-- Título Superior -->
  <text x="60" y="55" fill="#f8fafc" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Guia Rápido: Qual Método Escolher?</text>
  <text x="60" y="85" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Seleção direta do método ótimo com base no seu objetivo e nas características do problema</text>

  <!-- COLUNA 1: RAÍZES -->
  <g transform="translate(60, 115)">
    <rect width="260" height="460" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="36" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">RAÍZES DE EQUAÇÕES</text>
    <text x="20" y="64" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">f(x) = 0</text>
    
    <!-- Item 1 -->
    <g transform="translate(16, 85)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Bisseção</text>
      <text x="14" y="48" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Tem intervalo [a, b]</text>
      <text x="14" y="66" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Seguro contra divergência</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 172)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="14" y="26" fill="#34d399" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Newton-Raphson</text>
      <text x="14" y="48" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Conhece derivada f&apos;(x)</text>
      <text x="14" y="66" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Convergência muito rápida</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 259)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
      <text x="14" y="26" fill="#a78bfa" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Secante</text>
      <text x="14" y="48" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Sem derivada analítica</text>
      <text x="14" y="66" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Usa 2 chutes iniciais</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(16, 346)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="14" y="26" fill="#fbbf24" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Ponto Fixo</text>
      <text x="14" y="48" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Reescrito como x = g(x)</text>
      <text x="14" y="66" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Converge se |g&apos;(x)| &lt; 1</text>
    </g>
  </g>

  <!-- COLUNA 2: SISTEMAS LINEARES -->
  <g transform="translate(334, 115)">
    <rect width="260" height="460" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="36" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">ÁLGEBRA LINEAR</text>
    <text x="20" y="64" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Ax = b</text>
    
    <!-- Item 1 -->
    <g transform="translate(16, 85)">
      <rect width="228" height="162" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="28" fill="#38bdf8" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Gauss com Pivô</text>
      <text x="14" y="56" fill="#cbd5e1" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Recomendado Geral</text>
      <text x="14" y="82" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Pivoteamento parcial real</text>
      <text x="14" y="106" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Retrossubstituição</text>
      <text x="14" y="136" fill="#38bdf8" font-size="14" font-family="monospace">Custo: O(2/3 n³)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 259)">
      <rect width="228" height="162" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="28" fill="#10b981" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Gauss-Jordan</text>
      <text x="14" y="56" fill="#cbd5e1" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Diagonalização</text>
      <text x="14" y="82" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Zera acima e abaixo</text>
      <text x="14" y="106" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Leitura direta do vetor x</text>
      <text x="14" y="136" fill="#10b981" font-size="14" font-family="monospace">Custo: O(n³)</text>
    </g>
  </g>

  <!-- COLUNA 3: CÁLCULO NUMÉRICO -->
  <g transform="translate(608, 115)">
    <rect width="260" height="460" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="36" fill="#a78bfa" font-size="14" font-weight="700" font-family="monospace">INTEGRAIS E DERIVADAS</text>
    <text x="20" y="64" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">∫ f(x) e f&apos;(x)</text>
    
    <!-- Item 1 -->
    <g transform="translate(16, 85)">
      <rect width="228" height="102" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Trapézio Composto</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Integral definida</text>
      <text x="14" y="72" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Qualquer número de faixas n</text>
      <text x="14" y="92" fill="#38bdf8" font-size="13" font-family="monospace">Erro: O(h²)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 199)">
      <rect width="228" height="102" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
      <text x="14" y="26" fill="#a78bfa" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Simpson 1/3</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Alta precisão (parabólica)</text>
      <text x="14" y="72" fill="#fbbf24" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Exige n par obrigatório</text>
      <text x="14" y="92" fill="#a78bfa" font-size="13" font-family="monospace">Erro: O(h⁴)</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 313)">
      <rect width="228" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="14" y="26" fill="#f43f5e" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Diferença 3 Pontos</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Derivada f&apos;(x) numérica</text>
      <text x="14" y="72" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Dados experimentais</text>
      <text x="14" y="94" fill="#f43f5e" font-size="13" font-family="monospace">Erro: O(h²)</text>
    </g>
  </g>

  <!-- COLUNA 4: EDOS E MODELAGEM -->
  <g transform="translate(882, 115)">
    <rect width="260" height="460" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="36" fill="#10b981" font-size="14" font-weight="700" font-family="monospace">EDOS E MODELAGEM</text>
    <text x="20" y="64" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">dy/dx = f(x, y)</text>
    
    <!-- Item 1 -->
    <g transform="translate(16, 85)">
      <rect width="228" height="102" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Euler Explícito</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">PVI simples de 1ª ordem</text>
      <text x="14" y="72" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Passo de avanço rápido</text>
      <text x="14" y="92" fill="#38bdf8" font-size="13" font-family="monospace">Erro: O(h)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 199)">
      <rect width="228" height="102" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="26" fill="#10b981" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Euler Implícito</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">EDOs rígidas (stiff)</text>
      <text x="14" y="72" fill="#34d399" font-size="14" font-family="system-ui, sans-serif">Newton a cada passo</text>
      <text x="14" y="92" fill="#10b981" font-size="13" font-family="monospace">A-estável incondicional</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 313)">
      <rect width="228" height="108" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="14" y="26" fill="#fbbf24" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Runge-Kutta 2</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">Heun preditor-corretor</text>
      <text x="14" y="72" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Para 1 EDO ou sistema 2 EDOs</text>
      <text x="14" y="94" fill="#fbbf24" font-size="13" font-family="monospace">Erro: O(h²)</text>
    </g>
  </g>
</svg>