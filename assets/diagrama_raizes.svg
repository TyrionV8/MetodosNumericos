<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg-rz)"/>

  <!-- Título Superior -->
  <text x="60" y="55" fill="#f8fafc" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Raízes de Equações — f(x) = 0</text>
  <text x="60" y="85" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Comparação geométrica, formulação e dinâmica de convergência dos métodos fundamentais</text>

  <!-- CARD 1: BISSEÇÃO -->
  <g transform="translate(60, 115)">
    <rect width="345" height="460" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="24" y="38" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">BUSCA INTERVALAR</text>
    <text x="24" y="68" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Bisseção</text>
    
    <!-- Gráfico Geométrico -->
    <g transform="translate(20, 85)">
      <rect width="305" height="175" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <!-- Eixos -->
      <line x1="25" y1="100" x2="285" y2="100" stroke="#4b5563" stroke-width="1.5"/>
      <line x1="45" y1="15" x2="45" y2="160" stroke="#4b5563" stroke-width="1.5"/>
      
      <!-- Curva f(x) -->
      <path d="M 45 145 Q 140 120 200 70 T 275 15" fill="none" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Linhas verticais e pontos a, xm, b -->
      <line x1="65" y1="20" x2="65" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
      <text x="60" y="122" fill="#cbd5e1" font-size="16" font-weight="700" font-family="sans-serif">a</text>
      
      <line x1="165" y1="20" x2="165" y2="150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3"/>
      <circle cx="165" cy="100" r="5" fill="#38bdf8"/>
      <text x="155" y="125" fill="#38bdf8" font-size="18" font-weight="800" font-family="sans-serif">x<tspan font-size="13">m</tspan></text>
      
      <line x1="265" y1="20" x2="265" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
      <text x="260" y="122" fill="#cbd5e1" font-size="16" font-weight="700" font-family="sans-serif">b</text>

      <!-- Ponto Raiz Exata -->
      <circle cx="188" cy="100" r="4" fill="#ef4444"/>
      <text x="184" y="88" fill="#ef4444" font-size="14" font-weight="700" font-family="sans-serif">x*</text>
    </g>

    <!-- Equação em destaque -->
    <rect x="20" y="275" width="305" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="172" y="308" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="700" font-family="monospace">x_m = (a + b) / 2</text>

    <!-- Propriedades -->
    <g transform="translate(24, 355)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="700">Convergência Linear (r = 1)</text>
      <text x="0" y="26" fill="#94a3b8" font-size="15">Garantia: Teorema de Bolzano</text>
      <text x="0" y="50" fill="#94a3b8" font-size="15">Requisito: f(a) · f(b) &lt; 0</text>
      <text x="0" y="74" fill="#38bdf8" font-size="15" font-weight="600">Robusto e à prova de divergência</text>
    </g>
  </g>

  <!-- CARD 2: NEWTON-RAPHSON -->
  <g transform="translate(428, 115)">
    <rect width="345" height="460" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="24" y="38" fill="#34d399" font-size="14" font-weight="700" font-family="monospace">MÉTODO DAS TANGENTES</text>
    <text x="24" y="68" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Newton-Raphson</text>
    
    <!-- Gráfico Geométrico -->
    <g transform="translate(20, 85)">
      <rect width="305" height="175" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <!-- Eixos -->
      <line x1="25" y1="115" x2="285" y2="115" stroke="#4b5563" stroke-width="1.5"/>
      <line x1="45" y1="15" x2="45" y2="160" stroke="#4b5563" stroke-width="1.5"/>
      
      <!-- Curva f(x) -->
      <path d="M 50 145 C 110 140 180 90 265 25" fill="none" stroke="#34d399" stroke-width="3"/>
      
      <!-- Ponto x_k -->
      <line x1="235" y1="45" x2="235" y2="115" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="235" cy="45" r="5" fill="#34d399"/>
      <text x="227" y="136" fill="#cbd5e1" font-size="16" font-weight="700" font-family="sans-serif">x<tspan font-size="12">k</tspan></text>
      
      <!-- Reta Tangente -->
      <line x1="255" y1="25" x2="130" y2="135" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,3"/>
      <circle cx="152" cy="115" r="5" fill="#f43f5e"/>
      <text x="136" y="138" fill="#f43f5e" font-size="17" font-weight="800" font-family="sans-serif">x<tspan font-size="12">k+1</tspan></text>

      <!-- Raiz Exata x* -->
      <circle cx="172" cy="115" r="4" fill="#ef4444"/>
      <text x="168" y="102" fill="#ef4444" font-size="14" font-weight="700" font-family="sans-serif">x*</text>
    </g>

    <!-- Equação em destaque -->
    <rect x="20" y="275" width="305" height="52" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="172" y="308" text-anchor="middle" fill="#34d399" font-size="19" font-weight="700" font-family="monospace">x_novo = x - f(x)/f&apos;(x)</text>

    <!-- Propriedades -->
    <g transform="translate(24, 355)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="700">Convergência Quadrática (r = 2)</text>
      <text x="0" y="26" fill="#94a3b8" font-size="15">Velocidade: Dobra dígitos por ciclo</text>
      <text x="0" y="50" fill="#94a3b8" font-size="15">Requisito: Derivada analítica f&apos;(x) ≠ 0</text>
      <text x="0" y="74" fill="#34d399" font-size="15" font-weight="600">Mais rápido perto da raiz</text>
    </g>
  </g>

  <!-- CARD 3: SECANTE -->
  <g transform="translate(795, 115)">
    <rect width="345" height="460" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="24" y="38" fill="#a78bfa" font-size="14" font-weight="700" font-family="monospace">INTERPOLAÇÃO LINEAR</text>
    <text x="24" y="68" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Secante</text>
    
    <!-- Gráfico Geométrico -->
    <g transform="translate(20, 85)">
      <rect width="305" height="175" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <!-- Eixos -->
      <line x1="25" y1="115" x2="285" y2="115" stroke="#4b5563" stroke-width="1.5"/>
      <line x1="45" y1="15" x2="45" y2="160" stroke="#4b5563" stroke-width="1.5"/>
      
      <!-- Curva f(x) -->
      <path d="M 50 145 C 105 135 180 90 265 25" fill="none" stroke="#a78bfa" stroke-width="3"/>
      
      <!-- Dois Pontos de Amostragem -->
      <circle cx="95" cy="130" r="5" fill="#a78bfa"/>
      <text x="75" y="150" fill="#cbd5e1" font-size="15" font-weight="700" font-family="sans-serif">x<tspan font-size="11">k-1</tspan></text>

      <circle cx="245" cy="38" r="5" fill="#a78bfa"/>
      <text x="240" y="135" fill="#cbd5e1" font-size="15" font-weight="700" font-family="sans-serif">x<tspan font-size="11">k</tspan></text>
      
      <!-- Reta Secante (Corda) -->
      <line x1="70" y1="145" x2="265" y2="25" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5,3"/>
      <circle cx="152" cy="115" r="5" fill="#fbbf24"/>
      <text x="142" y="138" fill="#fbbf24" font-size="17" font-weight="800" font-family="sans-serif">x<tspan font-size="12">k+1</tspan></text>
    </g>

    <!-- Equação em destaque -->
    <rect x="20" y="275" width="305" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="172" y="308" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="700" font-family="monospace">Aproximação de f&apos; por 2 pontos</text>

    <!-- Propriedades -->
    <g transform="translate(24, 355)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="700">Convergência Superlinear (r ≈ 1.62)</text>
      <text x="0" y="26" fill="#94a3b8" font-size="15">Vantagem: Não requer derivada analítica</text>
      <text x="0" y="50" fill="#94a3b8" font-size="15">Requisito: Dois chutes iniciais x₀, x₁</text>
      <text x="0" y="74" fill="#a78bfa" font-size="15" font-weight="600">Quase tão veloz quanto Newton</text>
    </g>
  </g>
</svg>