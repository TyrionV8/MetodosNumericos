<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg-sys)"/>

  <!-- Título Superior -->
  <text x="60" y="55" fill="#f8fafc" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Sistemas Lineares — Ax = b</text>
  <text x="60" y="85" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Pivoteamento parcial e comparação de rotinas de escalonamento matricial</text>

  <!-- BLOCO SUPERIOR: PIVOTEAMENTO PARCIAL -->
  <g transform="translate(60, 115)">
    <rect width="1080" height="185" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="24" y="36" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">ESTABILIDADE NUMÉRICA</text>
    <text x="24" y="66" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Por que o Pivoteamento Parcial é Obrigatório?</text>
    
    <g transform="translate(24, 90)" font-family="monospace" font-size="17">
      <!-- Matriz Sem Pivoteamento -->
      <rect x="0" y="0" width="280" height="65" rx="8" fill="#030712" stroke="#ef4444" stroke-width="1.5"/>
      <text x="16" y="28" fill="#ef4444" font-weight="700">[ 0.0001   2.0000 | 2.0 ]</text>
      <text x="16" y="52" fill="#94a3b8">[ 1.0000   1.0000 | 2.0 ]</text>
      <text x="95" y="-8" fill="#ef4444" font-size="13" font-family="sans-serif" font-weight="700">Pivô Quase Nulo</text>

      <!-- Seta de Troca -->
      <g transform="translate(310, 15)">
        <line x1="0" y1="18" x2="70" y2="18" stroke="#38bdf8" stroke-width="3"/>
        <polygon points="70,12 85,18 70,24" fill="#38bdf8"/>
        <text x="-5" y="-8" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="700">Troca L1 ↔ L2</text>
      </g>

      <!-- Matriz Com Pivoteamento -->
      <rect x="425" y="0" width="280" height="65" rx="8" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
      <text x="441" y="28" fill="#10b981" font-weight="700">[ 1.0000   1.0000 | 2.0 ]</text>
      <text x="441" y="52" fill="#94a3b8">[ 0.0001   2.0000 | 2.0 ]</text>
      <text x="520" y="-8" fill="#10b981" font-size="13" font-family="sans-serif" font-weight="700">Pivô Máximo Real</text>

      <!-- Benefício Principal -->
      <g transform="translate(735, 8)" font-family="system-ui, sans-serif">
        <text x="0" y="18" fill="#f8fafc" font-size="16" font-weight="700">Multiplicadores restritos a |m| ≤ 1</text>
        <text x="0" y="42" fill="#38bdf8" font-size="15">Evita divisão por zero e amplificação de ruído</text>
      </g>
    </g>
  </g>

  <!-- BLOCO INFERIOR: GAUSS VS GAUSS-JORDAN -->
  <!-- GAUSS -->
  <g transform="translate(60, 325)">
    <rect width="525" height="250" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="24" y="36" fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">TRIANGULARIZAÇÃO SUPERIOR</text>
    <text x="24" y="66" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Eliminação de Gauss + Substituição</text>
    
    <g transform="translate(24, 90)">
      <!-- Mini Matriz Triangular -->
      <rect x="0" y="0" width="170" height="85" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <g font-family="monospace" font-size="16">
        <text x="16" y="26" fill="#f8fafc">[ u11  u12  u13 ]</text>
        <text x="16" y="50" fill="#38bdf8">[  0   u22  u23 ]</text>
        <text x="16" y="74" fill="#38bdf8">[  0    0   u33 ]</text>
      </g>

      <g transform="translate(195, 10)" font-family="system-ui, sans-serif">
        <text x="0" y="16" fill="#38bdf8" font-size="17" font-weight="700">Retrossubstituição de baixo para cima</text>
        <text x="0" y="42" fill="#94a3b8" font-size="15">Complexidade Algorítmica: O(2/3 n³)</text>
        <text x="0" y="68" fill="#cbd5e1" font-size="15" font-weight="600">Uso padrão para resolver sistemas Ax = b</text>
      </g>
    </g>

    <text x="24" y="225" fill="#94a3b8" font-size="15" font-family="system-ui, sans-serif">Arquivo: <tspan fill="#38bdf8" font-family="monospace" font-weight="700">sistemas_lineares/gauss_pivoteamento.m</tspan></text>
  </g>

  <!-- GAUSS-JORDAN -->
  <g transform="translate(615, 325)">
    <rect width="525" height="250" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="24" y="36" fill="#10b981" font-size="14" font-weight="700" font-family="monospace">DIAGONALIZAÇÃO COMPLETA</text>
    <text x="24" y="66" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Método de Gauss-Jordan</text>
    
    <g transform="translate(24, 90)">
      <!-- Mini Matriz Identidade -->
      <rect x="0" y="0" width="170" height="85" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <g font-family="monospace" font-size="16">
        <text x="16" y="26" fill="#10b981">[  1    0    0  | x1 ]</text>
        <text x="16" y="50" fill="#10b981">[  0    1    0  | x2 ]</text>
        <text x="16" y="74" fill="#10b981">[  0    0    1  | x3 ]</text>
      </g>

      <g transform="translate(195, 10)" font-family="system-ui, sans-serif">
        <text x="0" y="16" fill="#10b981" font-size="17" font-weight="700">Solução direta na última coluna</text>
        <text x="0" y="42" fill="#94a3b8" font-size="15">Zera termos abaixo e acima do pivô</text>
        <text x="0" y="68" fill="#cbd5e1" font-size="15" font-weight="600">Ideal para inversão matricial direta</text>
      </g>
    </g>

    <text x="24" y="225" fill="#94a3b8" font-size="15" font-family="system-ui, sans-serif">Arquivo: <tspan fill="#10b981" font-family="monospace" font-weight="700">sistemas_lineares/gauss_jordan.m</tspan></text>
  </g>
</svg>